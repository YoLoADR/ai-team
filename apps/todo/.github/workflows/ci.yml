name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/todo/**'
      - '!apps/todo/**/*.md'
  push:
    branches: [main]
    paths:
      - 'apps/todo/**'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/todo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage