name: CI
on:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: todo-app
      - name: Lint
        run: npm run lint
        working-directory: todo-app
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: todo-app
      - name: Test
        run: npm run test
        working-directory: todo-app