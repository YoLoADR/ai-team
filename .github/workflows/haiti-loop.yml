name: Haiti Loop — ai-team v1 (Hermes, VM 102)

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled, opened]
  pull_request:
    types: [opened, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      trigger_type:
        description: 'Type de trigger (po-spec | dev-impl | dev-fix | lead-review)'
        required: true
        default: 'po-spec'
      issue_number:
        description: 'Numero d issue ou PR'
        required: true
        default: '1'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  trigger-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Determine trigger type
        id: trigger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TRIGGER_TYPE=""
          ISSUE_NUMBER=""
          COMMENT_AUTHOR=""

          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            ISSUE_NUMBER="${{ github.event.issue.number }}"
            COMMENT_AUTHOR="${{ github.event.comment.user.login }}"

            # Skip bot comments to avoid loops
            if [[ "$COMMENT_AUTHOR" == *"bot"* ]] || [[ "$COMMENT_AUTHOR" == *"ai-team-loop"* ]] || [[ "$COMMENT_AUTHOR" == "YoLoADR"* ]]; then
              echo "Skipping bot/operator comment from $COMMENT_AUTHOR"
              # Still process if it's from the operator (YoLoADR) — they give instructions
              if [[ "$COMMENT_AUTHOR" == "YoLoADR"* ]]; then
                TRIGGER_TYPE="comment"
              else
                TRIGGER_TYPE=""
              fi
            else
              TRIGGER_TYPE="comment"
            fi
          elif [ "${{ github.event_name }}" = "issues" ]; then
            ISSUE_NUMBER="${{ github.event.issue.number }}"
            LABEL="${{ github.event.label.name }}"
            ACTION="${{ github.event.action }}"

            if [ "$ACTION" = "opened" ]; then
              TRIGGER_TYPE="po-spec"
            elif [ "$LABEL" = "feature" ] || [ "$LABEL" = "bug" ] || [ "$LABEL" = "user-story" ]; then
              TRIGGER_TYPE="po-spec"
            elif [ "$LABEL" = "ready-for-dev" ]; then
              TRIGGER_TYPE="dev-impl"
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            ISSUE_NUMBER="${{ github.event.pull_request.number }}"
            TRIGGER_TYPE="lead-review"
          elif [ "${{ github.event_name }}" = "pull_request_review" ]; then
            ISSUE_NUMBER="${{ github.event.pull_request.number }}"
            REVIEW_STATE="${{ github.event.review.state }}"
            if [ "$REVIEW_STATE" = "changes_requested" ]; then
              TRIGGER_TYPE="dev-fix"
            elif [ "$REVIEW_STATE" = "approved" ]; then
              TRIGGER_TYPE="lead-review"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRIGGER_TYPE="${{ inputs.trigger_type }}"
            ISSUE_NUMBER="${{ inputs.issue_number }}"
          fi

          echo "trigger_type=$TRIGGER_TYPE" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "Trigger: $TRIGGER_TYPE, Issue/PR: $ISSUE_NUMBER, Event: ${{ github.event_name }}"

      - name: Skip if no trigger
        if: steps.trigger.outputs.trigger_type == ''
        run: echo "No trigger type detected, skipping" && exit 0

      - name: Setup SSH to Precision VM 102
        env:
          SSH_KEY_B64: ${{ secrets.VM102_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/vm102_key
          chmod 600 ~/.ssh/vm102_key
          ssh-keyscan -H 100.111.21.3 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Trigger PO Agent — Jean-Marc (minimax-m3)
        if: steps.trigger.outputs.trigger_type == 'po-spec' || (steps.trigger.outputs.trigger_type == 'comment' && contains(github.event.issue.labels.*.name, 'user-story'))
        run: |
          ssh -i ~/.ssh/vm102_key -o StrictHostKeyChecking=no root@100.111.21.3 \
            "pct exec 102 -- su - hermes -c 'cd /home/hermes/repo && po-bot chat -q \"Issue #${{ steps.trigger.outputs.issue_number }}: analyser et generer la user story\"" 2>&1 || true

      - name: Trigger Dev Agent — Mireille (kimi-k2.7-code)
        if: steps.trigger.outputs.trigger_type == 'dev-impl' || (steps.trigger.outputs.trigger_type == 'comment' && contains(github.event.issue.labels.*.name, 'ready-for-dev'))
        run: |
          ssh -i ~/.ssh/vm102_key -o StrictHostKeyChecking=no root@100.111.21.3 \
            "pct exec 102 -- su - hermes -c 'cd /home/hermes/repo && dev-bot chat -q \"Issue #${{ steps.trigger.outputs.issue_number }}: implementer en TDD\"" 2>&1 || true

      - name: Trigger Dev-Fix Agent — Mireille
        if: steps.trigger.outputs.trigger_type == 'dev-fix'
        run: |
          ssh -i ~/.ssh/vm102_key -o StrictHostKeyChecking=no root@100.111.21.3 \
            "pct exec 102 -- su - hermes -c 'cd /home/hermes/repo && dev-bot chat -q \"PR #${{ steps.trigger.outputs.issue_number }}: corriger les retours du Lead Dev\"" 2>&1 || true

      - name: Trigger Lead Review Agent — Frantz (deepseek-v4-pro)
        if: steps.trigger.outputs.trigger_type == 'lead-review'
        run: |
          ssh -i ~/.ssh/vm102_key -o StrictHostKeyChecking=no root@100.111.21.3 \
            "pct exec 102 -- su - hermes -c 'cd /home/hermes/repo && lead-dev-bot chat -q \"PR #${{ steps.trigger.outputs.issue_number }}: review et decision\"" 2>&1 || true

      - name: Route comment to appropriate agent
        if: steps.trigger.outputs.trigger_type == 'comment'
        run: |
          # Route based on issue labels
          LABELS="${{ join(github.event.issue.labels.*.name, ',') }}"
          AGENT="po-bot"
          if [[ "$LABELS" == *"ready-for-dev"* ]] || [[ "$LABELS" == *"needs-work"* ]]; then
            AGENT="dev-bot"
          elif [[ "$LABELS" == *"in-review"* ]] || [[ "$LABELS" == *"needs-review"* ]]; then
            AGENT="lead-dev-bot"
          fi
          ssh -i ~/.ssh/vm102_key -o StrictHostKeyChecking=no root@100.111.21.3 \
            "pct exec 102 -- su - hermes -c 'cd /home/hermes/repo && ${AGENT} chat -q \"Issue #${{ steps.trigger.outputs.issue_number }}: nouveau commentaire de l operateur\"" 2>&1 || true

      - name: Notify Telegram
        if: steps.trigger.outputs.trigger_type != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          EMOJI="📋"
          case "${{ steps.trigger.outputs.trigger_type }}" in
            po-spec) EMOJI="📋" ;;
            dev-impl) EMOJI="🔧" ;;
            dev-fix) EMOJI="✅" ;;
            lead-review) EMOJI="👁" ;;
            comment) EMOJI="💬" ;;
          esac
          MSG="[haiti] ${EMOJI} ${{ steps.trigger.outputs.trigger_type }} — issue #${{ steps.trigger.outputs.issue_number }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=${MSG}" || true